                        field: {label: "Channel", name: "channel", widget: "string"}
                  - label: "Donate"
                    name: "donate"
                    fields:
                      - {label: "ID", name: "id", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Background", name: "bg", widget: "string", required: false}
                      - label: "Links"
                        name: "links"
                        widget: "list"
                        fields:
                          - {label: "Name", name: "name", widget: "string"}
                          - {label: "URL", name: "url", widget: "string"}
                  - label: "Media Coverage"
                    name: "media-coverage"
                    fields:
                      - {label: "ID", name: "id", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Full Width", name: "fullW", widget: "boolean", required: false}
                  - label: "About Us"
                    name: "about-us"
                    fields:
                      - {label: "ID", name: "id", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Donation Title", name: "donationTitle", widget: "string", required: false}
                      - label: "Members"
                        name: "members"
