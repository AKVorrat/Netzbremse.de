                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Platform", name: "platform", widget: "select", options: ["youtube", "ccc"]}
                      - {label: "YouTube Video ID", name: "youtubeID", widget: "string", required: false}
                      - {label: "YouTube Title", name: "youtubeTitle", widget: "string", required: false}
                      - {label: "Embed URL", name: "embedURL", widget: "string", required: false}
                      - {label: "External URL", name: "extURL", widget: "string", required: false}
                      - {label: "Thumbnail URL", name: "thumbnailURL", widget: "string", required: false}
                      - {label: "Alt URL (markdown link)", name: "altURL", widget: "string", required: false}
                      - {label: "Background", name: "bg", widget: "string", required: false}
                      - {label: "Full Width", name: "fullW", widget: "boolean", required: false}
                  - label: "Content Block"
                    name: "content"
                    fields:
                      - {label: "ID", name: "id", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Content", name: "content", widget: "markdown"}
                  - label: "Newsletter Signup"
                    name: "newsletter"
                    fields:
                      - {label: "ID", name: "id", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Background", name: "bg", widget: "string", required: false}
                      - {label: "Share Title", name: "shareTitle", widget: "string"}
                      - {label: "Share Body", name: "shareBody", widget: "string", required: false}
                      - {label: "Share Message", name: "shareMessage", widget: "string"}
                      - label: "Share Links"
                        name: "shareLinks"
                        widget: "list"
                        fields:
                          - {label: "Service", name: "service", widget: "string"}
                          - {label: "Message", name: "message", widget: "string", required: false}
                          - {label: "Subject", name: "subject", widget: "string", required: false}
                          - {label: "URL", name: "url", widget: "string", required: false}
                  - label: "Testimonials"
                    name: "testimonials"
                    fields:
                      - {label: "ID", name: "id", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Full Width", name: "fullW", widget: "boolean", required: false}
                  - label: "Contact Us"
                    name: "contact-us"
                    fields:
                      - {label: "ID", name: "id", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
